
name: Deploy React site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build React app
        run: |
          bun run build
          echo "=== Root files ==="
          ls -la
          echo "=== Build output directories ==="
          find . -maxdepth 3 -type d \( -name dist -o -name .output -o -name build \) -not -path './node_modules/*'
          echo "=== Generated HTML files ==="
          find . -maxdepth 4 -name '*.html' -not -path './node_modules/*'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

